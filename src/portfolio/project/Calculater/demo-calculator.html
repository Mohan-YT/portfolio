            }


            .number-pad .numbers {

            }

            .number-pad .numbers button {
                width: 4rem;
                height: 3rem;
                display: flex;
                justify-content: center;

                background-color: rgb(41, 40, 40);
                color: white;

                margin: 10px 5px;
            }

            .number-pad .numbers .btn1 {
                color: red;
            }

            .number-pad .numbers .btn2,
            .number-pad .numbers .btn3,
            .number-pad .numbers .btn4,
            .number-pad .numbers .btn8,
            .number-pad .numbers .btn12,

            }

            .number-pad .numbers .btn20 {

            .main-box {

            .type-input input {
                width: 100%;

            }

            .number-pad .numbers .btn1 {

            }

            .number-pad .numbers .btn2,
            .number-pad .numbers .btn3,
            .number-pad .numbers .btn4,

    <main>
        <div class="main-box">
            <div class="type-input display">
                <input type="text" id="input" name="display" placeholder="0">
            </div>
            <div class="math-icons">
                <div>
                    <i class="fa-regular fa-clock" onclick="histy()"></i>
                    <i class="bi bi-usb"></i>
                    <i class="bi bi-calculator"></i>
                </div>
                <div><i class="bi bi-backspace" onclick="input.value =input.value.slice(0,-1)"></i></div>
            </div>
            <div class="number-pad">
                <div class="numbers">
                    <div><button class="btn btn1" data-key="C" onclick="input.value=input.value.slice(0,0)"><i
                                class="fa-solid fa-c"></i></button></div>

                    <div><button class="btn btn2" data-key="'()'" onclick="input.value +='(',')'"><span>(
                                )</span></button></div>

                    <div><button class="btn btn3" data-key="%" onclick="input.value +='%'">%</button></div>

                    <div><button class="btn btn4" data-key="/" onclick="input.value +='/'"><i
                                class="fa-solid fa-divide"></i></button></div>

                    <!-- <div><button class="btn btn5" id="seven" onclick="input.value +=seven.textContent">7</button></div> -->
                    <div><button class="btn btn5" id="seven" data-key="7" onclick="input.value +='7'">7</button></div>

                    <div><button class="btn btn6" data-key="8" onclick="input.value +='8'">8</button></div>

                    <div><button class="btn btn7" data-key="9" onclick="input.value +='9'">9</button></div>

                    <div><button class="btn btn8" data-key="*" onclick="input.value +='*'"><i
                                class="fa-solid fa-xmark"></i></button></div>

                    <div><button class="btn btn9" data-key="4" onclick="input.value +='4'">4</button></div>

                    <div><button class="btn btn10" data-key="5" onclick="input.value +='5'">5</button></div>

                    <div><button class="btn btn11" data-key="6" onclick="input.value +='6'">6</button></div>

                    <div><button class="btn btn12" data-key="-" onclick="input.value +='-'"><i
                                class="fa-solid fa-minus"></i></button></div>

                    <div><button class="btn btn13" data-key="1" onclick="input.value +='1'">1</button></div>

                    <div><button class="btn btn14" data-key="2" onclick="input.value +='2'">2</button></div>

                    <div><button class="btn btn15" data-key="3" onclick="input.value +='3'">3</button></div>

                    <div><button class="btn btn16" data-key="+" onclick="input.value +='+'">+</button></div>

                    <div><button class="btn btn17" data-key="-,+" onclick="input.value +='-,+'">+/-</button></div>

                    <div><button class="btn btn18" data-key="0" onclick="input.value +='0'">0</button></div>
                    <div><button class="btn btn19" data-key="." onclick="input.value +='.'">.</button></div>

                    <div><button id="equal-btn" class="btn btn20" data-key="="
                            onclick="input.value=eval(input.value)"><i class="fa-solid fa-equals"></i></button></div>

                    <div class="history" id="msg">
                        <div id="body">
                        </div>
                        <a id="clear-history"><i class="fa-solid fa-xmark"></i></a>
                    </div>
                </div>

                <div class="history-tablet" id="msg1">
                    <div id="body1">
                    </div>
                    <button id="clear-history1">Clear History</button>
                </div>
            </div>

        </div>
    </main>


    <script>
        var input = document.getElementById("input");
        console.log("input=>", input);

        var equalbtn = document.getElementById("equal-btn")

        // mobile device
        var history = document.querySelector(".history")
        var msg = document.getElementById("msg")
        var bdy = document.getElementById("body")
        var clearhistory = document.getElementById("clear-history")

        function histy() {
            // if(msg.style.display === "none"){
            //     msg.style.display = "block"
            // }else{
            //     msg.style.display = "none"
            // }
            if (msg.style.left === "-100%") {
                msg.style.left = "0"

            } else {
                msg.style.left = "-100%"
            }
        }

        equalbtn.addEventListener("click", function () {
            var p = document.createElement("p")
            p.textContent = input.value
            bdy.append(p)
        })

        clearhistory.addEventListener("click", function () {
            bdy.innerHTML = ""
            msg.style.transitionDelay = ".1s"
            msg.style.left = "-100%"
        })


        // tablet device


        var history = document.querySelector(".history")
        var msg1 = document.getElementById("msg1")
        var bdy1 = document.getElementById("body1")
        var clearhistory1 = document.getElementById("clear-history1")

        equalbtn.addEventListener("click", function () {
            var p = document.createElement("p")
            p.textContent = input.value
            bdy1.append(p)
        })

        clearhistory1.addEventListener("click", function () {
            bdy1.innerHTML = ""
        })

        document.addEventListener("keydown", function (event) {
            let key = event.key.toUpperCase();
            let buttons = document.querySelector(`.btn[data-key="${key}"]`) //find matching button

            if (buttons) {
                buttons.style.backgroundColor = "gray";
                setTimeout(() => {
                    buttons.style.backgroundColor = "";
                }, 150)
            }

            // Only handle printable characters, not special keys (e.g., Enter, Shift)
            if (event.key.length == 1) {
                // Add the pressed key to the input box value
                input.value += event.key;
            }

            // Optional: Handle backspace to delete the last character
            if (event.key === "Backspace") {
                input.value = input.value.slice(0, -1);
            }
            if(event.key==="Enter"){
                input.value=eval(input.value)
            }
        });

    </script>
</body>
